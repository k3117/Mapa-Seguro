name: mapa-base
on:
  push:
    paths: [".github/workflows/mapa-base.yml"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "" | base64 -d | xz -d > /tmp/p.diff
          git apply /tmp/p.diff
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mapa simplificado passa a usar fundo cinza claro (Esri Light Gray) com nomes de ruas" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_012YckZsXNMFH3WjLPN8bHU6"
          git push
