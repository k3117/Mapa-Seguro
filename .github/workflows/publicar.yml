name: Coletar dados oficiais e publicar

# Roda ao enviar código, todo dia às 06:10 (Brasília) e manualmente (Actions > Run workflow).
on:
  push:
    branches: [main]
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:

permissions:
  contents: write   # para salvar no repositório os dados atualizados (auditoria pelo histórico)
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r scripts/requirements.txt pytest reportlab

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # ---------- coleta (falhas de rede não derrubam a publicação: os dados anteriores são mantidos)
      - name: Coletar notas oficiais (PCGO, SSP-GO, PMGO)
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/coletar_ocorrencias.py
      - name: Atualizar estatísticas agregadas da SSP-GO (PDFs oficiais)
        continue-on-error: true
        run: python scripts/atualizar_dados.py
      - name: Geocodificar unidades públicas de atendimento
        continue-on-error: true
        run: python scripts/geocodificar_servicos.py

      # ---------- regras: se os dados novos violarem alguma regra, volta para a versão anterior
      - name: Validar regras de privacidade e origem
        run: |
          if ! python scripts/validar_dados.py; then
            echo "::warning::Dados novos reprovados na validação; mantendo a versão anterior."
            git checkout -- data feed.xml
            python scripts/validar_dados.py
          fi
      - name: Testes
        run: |
          python -m pytest -q tests/
          node --test tests/*.test.mjs

      - name: Salvar dados atualizados no repositório
        # Se alguém enviar algo ao GitHub durante a coleta, integra as mudanças e tenta de novo.
        # Uma falha aqui não impede a publicação do site.
        continue-on-error: true
        run: |
          git config user.name "mapa-seguro-bot"
          git config user.email "mapa-seguro-bot@users.noreply.github.com"
          git add data feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "dados: coleta automática $(date -u +%Y-%m-%d)"
            for tentativa in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              echo "::warning::Envio recusado (tentativa $tentativa); tentando de novo."
              sleep 10
            done
          fi

      - name: Montar o site
        run: |
          mkdir _site
          cp -r *.html feed.xml assets vendor data _site/
          # arquivos internos da coleta não são publicados
          rm -f _site/data/coleta_bruta.json _site/data/geocache.json _site/data/coleta_log.json _site/data/ingestao_log.json _site/data/reportagens.json _site/data/moderacao.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
