name: auditoria-qa
on:
  push:
    paths: [".github/workflows/auditoria-qa.yml"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          echo "" | base64 -d | xz -d > /tmp/p.diff
          git apply /tmp/p.diff
          echo "" | base64 -d > /tmp/strip.py
          python /tmp/strip.py
          pip install -q -r scripts/requirements.txt pytest reportlab
          python scripts/validar_dados.py
          python -m pytest -q tests/
          node --test tests/*.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auditoria QA: nenhum texto de nota guardado, datas coerentes, casos com criança, textos jornalísticos, página do registro e estatísticas" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_012YckZsXNMFH3WjLPN8bHU6"
          git push
